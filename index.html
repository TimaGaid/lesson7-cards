<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Два маршрути на вихідні</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <h1>Два маршрути на вихідні</h1>

        <article class="card card--park">
            <h2>Прогулянка в парку</h2>
            <p>Коло від головного входу до озера й назад. На дорогу вистачить години.</p>
        </article>

        <article class="card card--river">
            <span class="badge">Нове</span>
            <h2>Велосипедом уздовж річки</h2>
            <p>Старт біля мосту, далі вздовж набережної до пляжу. Дорогою є де зупинитися на каву.</p>
        </article>
    </main>
</body>
</html>
